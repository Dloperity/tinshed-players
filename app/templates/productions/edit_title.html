{% extends "base.html" %}
{% block title %}Edit production title · Tinshed Players{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit production title</h1>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label" for="title">Title *</label>
    <input class="form-control" id="title" name="title" required value="{{ production.title }}">
  </div>
  <button class="btn btn-primary" type="submit">Save title</button>
  <a class="btn btn-link" href="{{ url_for('productions.manage_production', production_id=production.id) }}">Cancel</a>
</form>
{% endblock %}
