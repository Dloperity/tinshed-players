{% extends "base.html" %}
{% block title %}Edit performance schedule · Tinshed Players{% endblock %}
{% block content %}
<h1 class="h3">Edit performance schedule</h1>
<p class="text-muted">{{ production.title }}</p>
<form method="post" class="vstack gap-3" style="max-width: 32rem">
  <div>
    <label class="form-label" for="date">Date *</label>
    <input class="form-control" id="date" name="date" type="date" value="{{ performance.date.isoformat() }}" required>
  </div>
  <div>
    <label class="form-label" for="start_time">Start time *</label>
    <input class="form-control" id="start_time" name="start_time" type="time" value="{{ performance.start_time.strftime('%H:%M') }}" required>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save schedule</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('productions.production_schedule', production_id=production.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
