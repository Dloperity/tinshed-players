{% extends "base.html" %}
{% block title %}Edit assignment · Tinshed Players{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit assignment</h1>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Volunteer *</label>
    <select class="form-select" name="volunteer_id" required>
      {% for volunteer in volunteers %}
      <option value="{{ volunteer.id }}" {{ 'selected' if volunteer.id == assignment.volunteer_id }}>{{ volunteer.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Performance *</label>
    <select class="form-select" name="performance_id" required>
      {% for performance in performances %}
      <option value="{{ performance.id }}" data-roles="{{ performance.crew_calls | map(attribute='role') | join(',') }}" {{ 'selected' if performance.id == assignment.performance_id }}>
        {{ performance.production.title }} — {{ performance.date.strftime('%d %b %Y') }} {{ performance.start_time.strftime('%H:%M') }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Role *</label>
    <input class="form-control" name="role" required list="role-options" value="{{ assignment.role }}" placeholder="e.g. Sound Op">
    <datalist id="role-options"></datalist>
    <div class="form-text">Suggestions come from the selected performance's crew call.</div>
  </div>
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-link" href="{{ url_for('assignments.list_assignments') }}">Cancel</a>
</form>
<script>
  (function () {
    var performanceSelect = document.querySelector('select[name="performance_id"]');
    var roleOptions = document.getElementById('role-options');
    function refreshRoleOptions() {
      var option = performanceSelect.selectedOptions[0];
      var roles = option && option.dataset.roles ? option.dataset.roles.split(',') : [];
      roleOptions.innerHTML = '';
      roles.forEach(function (role) {
        if (!role.trim()) return;
        var opt = document.createElement('option');
        opt.value = role.trim();
        roleOptions.appendChild(opt);
      });
    }
    performanceSelect.addEventListener('change', refreshRoleOptions);
    refreshRoleOptions();
  })();
</script>
{% endblock %}
