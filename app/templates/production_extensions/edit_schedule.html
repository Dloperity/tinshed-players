{% extends "base.html" %}
{% block title %}Edit performance · {{ production.title }}{% endblock %}
{% block content %}
{% include "productions/_control_assets.html" %}
<h1 class="h3 mb-3">Edit performance schedule — {{ production.title }}</h1>
{% if error_message %}<p class="text-danger" role="alert">{{ error_message }}</p>{% endif %}
<form method="post" data-time-range-form>
  <div class="mb-3"><label class="form-label" for="date">Date</label><input class="form-control" id="date" name="date" type="date" required value="{{ form_values.get('date') if form_values else performance.date.isoformat() }}"></div>
  <div class="mb-3"><label class="form-label" for="start_time">Start time</label><input class="form-control" id="start_time" name="start_time" type="time" required value="{{ form_values.get('start_time') if form_values else performance.start_time.strftime('%H:%M') }}"></div>
  <div class="mb-3"><label class="form-label" for="duration_minutes">Duration (minutes)</label><input class="form-control" id="duration_minutes" name="duration_minutes" type="number" min="1" step="1" required value="{{ form_values.get('duration_minutes') if form_values else performance.duration_minutes or '' }}"><div class="form-text" data-time-range-preview></div></div>
  <button class="btn btn-primary" type="submit">Save changes</button> <a class="btn btn-link" href="{{ url_for('production_extensions.manage_production_enhanced', production_id=production.id) }}">Cancel</a>
</form>
{% endblock %}
